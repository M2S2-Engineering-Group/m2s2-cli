[package]
name = "m2s2-cli"
version = "0.1.23"
edition = "2024"
description = "CLI for scaffolding M²S² design system projects"
authors = ["M²S² Engineering Group <contact@m2s2.io>"]
license = "MIT"
repository = "https://github.com/M2S2-Engineering-Group/m2s2-cli"
homepage = "https://github.com/M2S2-Engineering-Group/m2s2-cli"
keywords = ["cli", "scaffold", "react", "angular", "m2s2"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "m2s2"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
inquire = "0.7"
indicatif = "0.17"
console = "0.15"
handlebars = "6"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
semver = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
